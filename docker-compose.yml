version: "3.9"

# DiagramKG — Docker Compose (Neo4j only)
# Backend and frontend run locally via uvicorn / npm run dev for fast iteration.
#
# Usage:
#   docker-compose up -d
#   Neo4j Browser: http://localhost:7474  (user: neo4j / password: diagramkg)
#   Bolt:          bolt://localhost:7687

services:
  neo4j:
    image: neo4j:5.22-community
    container_name: diagramkg-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser (HTTP)
      - "7687:7687"   # Bolt protocol (Python driver)
    environment:
      - NEO4J_AUTH=neo4j/diagramkg
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
